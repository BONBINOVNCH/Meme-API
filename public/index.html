<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Document</title>
    </head>
    <body>
        <div class="wrapper">
            <header class="header">
                <div class="header_img_block">
                    <img src="./imgs/memz.png" alt="" class="header_img" />
                </div>
                <div class="header_options_block">
                    <div class="header_option active">Головна</div>

                    <a
                        style="text-decoration: none; color: black"
                        href="constructor.html"
                        ><div class="header_option">Конструктор</div></a
                    >
                </div>
                <div class="header_random_mem_block">
                    <button class="header_random_mem_button">
                        <span class="header_random_mem_text"
                            >😎Рандомний мем</span
                        >
                    </button>
                </div>
            </header>

            <main class="main">
                <div class="main_title">
                    <div class="main_title_text_block">
                        <h1 class="main_title_text_bigText">
                            Бібліотека мемів
                        </h1>
                        <p class="main_title_text_smallText">
                            твоя щодена доза сміху 😈
                        </p>
                    </div>
                </div>

                <div class="main_content">
                    <div class="main_content_head">
                        <span class="main_content_head_title"
                            >свіжі меми🔥</span
                        >
                        <button class="update_memes">🔄оновити</button>
                    </div>
                    <div class="main_content_block"></div>
                </div>

        <!-- <input class="file" type="file" name="" id="" /> -->
